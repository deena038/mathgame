<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Slayer Math Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--night:#14162b;--deep:#1f2347;--moon:#f6ecc9;--ember:#ff5a3c;--wist:#a58be0;--teal:#3fd0b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--moon);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;
background-image:radial-gradient(circle at 50% 100%,transparent 38%,rgba(165,139,224,.13) 39% 45%,transparent 46%),radial-gradient(circle at 50% 100%,transparent 38%,rgba(165,139,224,.13) 39% 45%,transparent 46%);
background-size:56px 28px;background-position:0 0,28px 14px}
h1,h2,.big{font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-weight:400;margin:0}
main{max-width:760px;margin:0 auto;padding:20px 18px 40px}
.moon{width:74px;height:74px;border-radius:50%;background:var(--moon);box-shadow:0 0 40px rgba(246,236,201,.45);margin:0 auto 12px}
h1{font-size:clamp(28px,6vw,44px);text-align:center;line-height:1.15}
.sub{text-align:center;font-size:20px;margin:10px 0 26px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{border:3px solid var(--wist);background:var(--deep);color:var(--moon);border-radius:18px;padding:20px 12px;font:inherit;font-weight:800;font-size:22px;min-height:96px;cursor:pointer}
.mode b{display:block;font-family:"Dela Gothic One",system-ui,sans-serif;font-weight:400;font-size:34px;color:var(--teal);margin-bottom:4px}
.mode:active{background:var(--wist);color:var(--night)}
#hero img{height:120px;width:auto;max-width:130px;object-fit:contain;border-radius:14px}
.pick{display:block;width:100%;margin-top:14px;border:3px dashed var(--teal);background:none;color:var(--moon);border-radius:18px;padding:16px;font:inherit;font-weight:800;font-size:20px}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin-bottom:10px}
.back{background:none;border:2px solid var(--wist);color:var(--moon);border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;font-size:18px}
.arena{display:flex;justify-content:space-between;align-items:flex-end;background:var(--deep);border-radius:20px;padding:12px 18px 0;border:2px solid rgba(165,139,224,.4)}
.arena svg{height:120px;width:auto}
#demonbox{text-align:center;flex:1;max-width:250px}
.hp{height:16px;border-radius:9px;background:#0c0d1c;overflow:hidden;border:2px solid var(--wist);margin:0 8px 6px}
.hp i{display:block;height:100%;width:100%;background:var(--ember);transition:width .4s}
#demon{transition:transform .2s}
.hit{animation:hit .4s}@keyframes hit{25%{transform:translateX(12px) rotate(6deg)}60%{transform:translateX(-8px) rotate(-4deg)}}
.slash{animation:sl .35s}@keyframes sl{50%{transform:translateX(30px)}}
.q{text-align:center;font-size:clamp(46px,11vw,76px);margin:22px 0 8px;font-family:"Dela Gothic One",system-ui,sans-serif}
.ans{margin:0 auto 14px;max-width:340px;min-height:76px;border:4px solid var(--teal);border-radius:16px;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:46px;text-align:center;line-height:68px;background:#0c0d1c}
.ans.bad{border-color:var(--ember);animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{text-align:center;font-size:22px;font-weight:800;min-height:32px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:0 auto}
.pad button{min-height:68px;border-radius:16px;border:0;background:var(--wist);color:var(--night);font-family:"Dela Gothic One",system-ui,sans-serif;font-size:30px}
.pad button:active{transform:scale(.95);background:var(--moon)}
.pad .del{background:#d9d3ea}.pad .go{background:var(--teal)}
.end{text-align:center;padding-top:20px}
.end h2{font-size:clamp(30px,7vw,46px);margin:14px 0}
.end p{font-size:22px}
.stars{font-size:44px;letter-spacing:6px;margin:10px 0 24px}
.again{border:0;border-radius:16px;background:var(--ember);color:#fff;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:26px;padding:18px 34px;margin:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="menu">
  <div class="moon"></div>
  <h1>Moon Slayer<br>Math Training</h1>
  <p class="sub">Pick a skill. Beat the demon with 10 right answers. Every level gets a little harder!</p>
  <div class="menu">
    <button class="mode" data-m="add"><b>+</b>Add</button>
    <button class="mode" data-m="sub"><b>−</b>Subtract</button>
    <button class="mode" data-m="mul"><b>×</b>Multiply</button>
    <button class="mode" data-m="div"><b>÷</b>Divide</button>
    <button class="mode" data-m="mix" style="grid-column:span 2"><b>★</b>Mix of all</button>
  </div>
  <button class="pick" id="pick">📷 Use my own hero picture</button>
  <input type="file" id="file" accept="image/*" class="hide">
</section>

<section id="game" class="hide">
  <div class="top"><button class="back" id="back">‹ Menu</button><span id="count">Hit 0 / 10</span><span id="timer">⏱ 0:00</span><span id="stars">⭐ 0</span><button class="back" id="snd">🔊</button></div>
  <div class="arena">
    <div id="hero"><img id="heroimg" class="hide" alt="My hero"><svg id="herosvg" viewBox="0 0 90 120" aria-hidden="true">
      <path d="M20 50c-8 30-4 52 4 64h12V60zM70 50c8 30 4 52-4 64H52V60z" fill="#2a2145"/>
      <path d="M22 44c-2-22 14-34 28-30 14 3 20 16 16 32-6-10-14-14-22-14s-16 4-22 12z" fill="#2a2145"/>
      <circle cx="44" cy="52" r="16" fill="#f3c9a5"/>
      <path d="M26 48c6-12 30-14 36 0-8-5-28-5-36 0z" fill="#2a2145"/>
      <rect x="27" y="45" width="36" height="5" fill="#ff7fb0"/>
      <circle cx="38" cy="56" r="2.2" fill="#2a2145"/><circle cx="51" cy="56" r="2.2" fill="#2a2145"/>
      <path d="M40 62q5 4 10 0" stroke="#a5534a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M24 72h40l8 48H16z" fill="#2c3a7a"/>
      <path d="M24 72h40l4 20H20z" fill="#a58be0" opacity=".55"/>
      <rect x="36" y="76" width="16" height="44" fill="#f6ecc9" opacity=".2"/>
      <path d="M70 70l16-48" stroke="#9fe9ff" stroke-width="5" stroke-linecap="round"/>
      <path d="M68 76l8-3" stroke="#f6ecc9" stroke-width="5" stroke-linecap="round"/>
    </svg></div>
    <div id="demonbox">
      <div class="hp"><i id="hp"></i></div>
      <svg id="demon" viewBox="-14 0 128 120" aria-hidden="true">
        <g fill="none" stroke="#6a3fa0" stroke-width="7" stroke-linecap="round"><path d="M22 50Q2 38-6 20"/><path d="M16 74Q-4 72-10 84"/><path d="M16 98Q-2 104-6 116"/><path d="M78 50Q98 38 106 20"/><path d="M84 80Q104 84 108 98"/><path d="M80 102Q100 108 106 118"/></g>
        <g fill="#f6ecc9"><circle cx="-6" cy="20" r="4.5"/><circle cx="-10" cy="84" r="4.5"/><circle cx="-6" cy="116" r="4.5"/><circle cx="106" cy="20" r="4.5"/><circle cx="108" cy="98" r="4.5"/><circle cx="106" cy="118" r="4.5"/></g>
        <path d="M30 28l-10-22 24 14zM70 28l10-22-24 14z" fill="#f6ecc9"/>
        <path d="M14 112c-8-50 8-90 36-90s44 40 36 90z" fill="#6a3fa0"/>
        
        <g fill="#ffe14d"><ellipse cx="32" cy="44" rx="6" ry="7"/><ellipse cx="50" cy="44" rx="6" ry="7"/><ellipse cx="68" cy="44" rx="6" ry="7"/><ellipse cx="41" cy="64" rx="6" ry="7"/><ellipse cx="59" cy="64" rx="6" ry="7"/></g>
        <g fill="#14162b"><rect x="30.5" y="38" width="3" height="12" rx="1.5"/><rect x="48.5" y="38" width="3" height="12" rx="1.5"/><rect x="66.5" y="38" width="3" height="12" rx="1.5"/><rect x="39.5" y="58" width="3" height="12" rx="1.5"/><rect x="57.5" y="58" width="3" height="12" rx="1.5"/></g>
        <path d="M32 86q18 14 36 0l-4 12q-14 6-28 0z" fill="#14162b"/>
        <path d="M38 88l3 7 3-6 3 7 3-7 3 6 3-7 3 8" stroke="#f6ecc9" stroke-width="2" fill="none"/>
      </svg>
    </div>
  </div>
  <div class="q" id="q"></div>
  <div class="ans" id="ans"></div>
  <div class="msg" id="msg"></div>
  <div class="pad" id="pad"></div>
</section>

<section id="end" class="end hide">
  <div class="moon"></div>
  <h2 id="endt">Demon defeated!</h2>
  <div class="stars" id="endstars"></div>
  <p id="endp"></p>
  <button class="again" id="again">Next level ›</button>
  <button class="again" id="home" style="background:var(--wist);color:var(--night)">Menu</button>
</section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var mode="add",done=0,firstTry=0,tries=0,cur=null,typed="",level=1;
var T={add:[[1,9,1,9],[10,20,1,9],[10,50,10,50],[10,99,10,99],[100,500,10,99],[100,999,100,999]],
sub:[[2,9,1,9],[10,20,1,9],[10,50,10,50],[10,99,10,99],[100,500,10,99],[100,999,100,999]],
mul:[[2,5,2,5],[2,9,2,9],[2,12,2,12],[11,30,2,5],[11,50,2,9],[11,99,2,9]],
div:[[2,5,2,5],[2,9,2,9],[2,12,2,12],[2,9,11,20],[2,9,11,50],[2,12,12,99]]};
var cheers=["Great hit! ⚔️","Water Breathing! 🌊","Nice slash!","You’re strong!","Moonlight strike! 🌙"];
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function make(m){
  if(m==="mix")m=["add","sub","mul","div"][r(0,3)];
  var p=T[m][Math.min(level,6)-1],a=r(p[0],p[1]),b=r(p[2],p[3]),t;
  if(m==="add"){return{t:a+" + "+b,a:a+b}}
  if(m==="sub"){if(b>a){t=a;a=b;b=t}if(a===b)a+=1;return{t:a+" − "+b,a:a-b}}
  if(m==="mul"){return{t:a+" × "+b,a:a*b}}
  return{t:(a*b)+" ÷ "+a,a:b}
}
var t0=0,tick=null,ac=null,snd=true;
function tone(f,t,d,ty,v){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=ty||"triangle";o.frequency.value=f;g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function sfx(k){if(k==="ok"){tone(660,0,.12);tone(880,.1,.2)}else if(k==="bad"){tone(160,0,.25,"sawtooth",.12)}else if(k==="win"){[523,659,784,1047].forEach(function(f,i){tone(f,i*.14,.3)})}else if(k==="key"){tone(440,0,.04,"sine",.06)}}
function fmt(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function startTimer(){clearInterval(tick);t0=Date.now();$("timer").textContent="⏱ 0:00";tick=setInterval(function(){$("timer").textContent="⏱ "+fmt(Math.floor((Date.now()-t0)/1000))},500)}
function stopTimer(){clearInterval(tick);return Math.round((Date.now()-t0)/1000)}
function show(id){["menu","game","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function setAns(){$("ans").textContent=typed}
function next(){cur=make(mode);tries=0;typed="";$("q").textContent=cur.t+" =";setAns();$("count").textContent="Level "+level+" · Hit "+done+" / 10"}
function start(m){mode=m;done=0;firstTry=0;$("hp").style.width="100%";$("msg").textContent="Ready? Go!";show("game");next();startTimer();$("stars").textContent="⭐ 0"}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function check(){
  if(typed==="")return;
  if(+typed===cur.a){
    if(tries===0){firstTry++;$("stars").textContent="⭐ "+firstTry}
    done++;$("hp").style.width=(100-done*10)+"%";
    sfx("ok");anim($("hero"),"slash");anim($("demon"),"hit");
    $("msg").textContent=cheers[r(0,cheers.length-1)];
    if(done>=10){setTimeout(finish,600);return}
    setTimeout(next,450)
  }else{
    tries++;sfx("bad");anim($("ans"),"bad");$("ans").classList.add("bad");
    setTimeout(function(){$("ans").classList.remove("bad")},400);
    if(tries>=2){$("msg").textContent="The answer is "+cur.a+". Next one!";done=done;setTimeout(next,1800);return}
    $("msg").textContent="Almost! Try one more time.";typed="";setAns()
  }
}
function finish(){sfx("win");var secs=stopTimer();
  show("end");
  var s=firstTry>=9?3:firstTry>=7?2:1;
  $("endstars").textContent="⭐⭐⭐".slice(0,s)+"☆☆☆".slice(0,3-s);
  $("endp").textContent="You got "+firstTry+" of 10 right on the first try. Time: "+fmt(secs)+". The next demon is a little harder!";
  $("endt").textContent="Level "+level+(s===3?" done! Perfect slash!":" done! Demon defeated!")
}
var keys=["1","2","3","4","5","6","7","8","9","⌫","0","Go"];
keys.forEach(function(k){
  var b=document.createElement("button");b.textContent=k;
  if(k==="⌫")b.className="del";if(k==="Go")b.className="go";
  b.addEventListener("click",function(){
    sfx("key");if(k==="⌫")typed=typed.slice(0,-1);
    else if(k==="Go"){check();return}
    else if(typed.length<5)typed+=k;
    setAns()
  });
  $("pad").appendChild(b)
});
Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.addEventListener("click",function(){level=1;start(b.dataset.m)})});
$("pick").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){$("heroimg").src=rd.result;$("heroimg").classList.remove("hide");$("herosvg").classList.add("hide");$("pick").textContent="✅ Picture added! Tap to change"};
  rd.readAsDataURL(f)
});
$("back").addEventListener("click",function(){clearInterval(tick);show("menu")});
$("home").addEventListener("click",function(){show("menu")});
$("again").addEventListener("click",function(){level++;start(mode)});
$("snd").addEventListener("click",function(){snd=!snd;$("snd").textContent=snd?"🔊":"🔇"});
})();
</script>
</body>
</html>
