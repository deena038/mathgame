<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(#2d1655,#14162b);color:var(--moon);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-weight:500}
.big{font-family:"Dela Gothic One",system-ui,sans-serif;font-weight:400}
main{max-width:980px;margin:0 auto;padding:12px 14px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:clamp(20px,4.4vw,30px);margin:0}
.coins{background:#0c0d1c;border:3px solid var(--gold);color:var(--gold);border-radius:20px;padding:6px 16px;font-size:24px}
.sb{background:none;border:2px solid var(--wist);color:var(--moon);border-radius:12px;padding:6px 12px;font-size:18px}
.grid{display:grid;grid-template-columns:minmax(230px,38%) 1fr;gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.stage{position:relative;overflow:hidden;background:#2b1d52;border:3px solid var(--wist);border-radius:22px;padding:8px 8px 0;display:flex;align-items:flex-end;justify-content:center;min-height:min(62vh,480px)}
#av{position:relative;z-index:1;height:min(58vh,450px);display:block;margin:0 auto}
#av svg{height:100%;width:auto}
.stage.walk #av{animation:rw 3s ease-in forwards}
@keyframes rw{0%{transform:translate(-8px,-40px) scale(.5)}20%{transform:translate(8px,-28px) scale(.62)}40%{transform:translate(-8px,-14px) scale(.74)}60%{transform:translate(8px,-2px) scale(.86)}80%{transform:translate(-6px,6px) scale(.95)}100%{transform:translate(0,8px) scale(1)}}
.bg{position:absolute;inset:0}.bg svg{width:100%;height:100%;display:block}
.stage.walk #bgd,.stage:not(.walk) #bgr{display:none}
.fl{animation:fl .5s infinite}@keyframes fl{0%,60%{opacity:0}70%{opacity:1}100%{opacity:0}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tabs button{flex:1;min-width:92px;border:3px solid var(--wist);background:var(--card);color:var(--moon);border-radius:16px;padding:10px 6px;font:inherit;font-weight:800;font-size:18px}
.tabs button.on{background:var(--pink);color:#2a1030;border-color:var(--pink)}
.panel{background:var(--card);border:3px solid var(--wist);border-radius:20px;padding:14px;min-height:300px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.it{border:3px solid #54407f;background:#1d1238;color:var(--moon);border-radius:14px;padding:12px 6px;font:inherit;font-weight:800;font-size:17px}
.it small{display:block;color:var(--gold);font-size:16px;margin-top:3px}
.it.sel{border-color:var(--teal);background:#12413f}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.sw button{width:46px;height:46px;border-radius:50%;border:4px solid #fff3;padding:0}
.sw button.sel{border-color:#fff}
.lab{font-weight:800;font-size:18px;margin:6px 0 2px}
.buy,.go{border:0;border-radius:16px;background:var(--gold);color:#2a1030;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:22px;padding:14px 22px;width:100%;margin-top:6px}
.buy:disabled{opacity:.45}.go{background:var(--pink)}
.mq{text-align:center;font-size:clamp(40px,9vw,64px);margin:6px 0 14px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch button{border:3px solid var(--wist);background:#1d1238;color:var(--moon);border-radius:18px;padding:16px;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:34px}
.ch button:active{background:var(--wist);color:#1d1238}
.m{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:10px 0;color:var(--gold)}
.theme{text-align:center;font-size:20px}
.theme .big{font-size:30px;color:var(--pink);margin:4px 0}
.stars{font-size:46px;text-align:center;margin:6px 0;letter-spacing:4px}
.note{text-align:center;font-size:19px;margin:4px 0}
@media (prefers-reduced-motion:reduce){.stage.walk #av,.fl{animation:none}}
</style>
</head>

  if(q.x===4)o+='<g fill="'+xc+'" opacity=".7"><ellipse cx="36" cy="140" rx="34" ry="70" transform="rotate(-18 36 140)"/><ellipse cx="164" cy="140" rx="34" ry="70" transform="rotate(18 164 140)"/></g>';
  if(HC[q.h])o+=HC[q.h].replace(/@/g,hc);else o+='<path d="'+HB[q.h]+'" fill="'+hc+'"/>';
  if(q.h===3)o+='<ellipse cx="124" cy="42" rx="5" ry="7" fill="#ff7fb0"/>';
  o+='<g fill="'+sk+'"><path d="M91 72V98Q100 106 109 98V72Z"/><path d="M76 96Q72 130 82 168Q70 196 73 218L127 218Q130 196 118 168Q128 130 124 96Z"/>';
  o+='<path d="M73 216Q72 270 82 302Q80 340 85 370L96 370Q98 332 96 302Q100 262 100 222Z"/><path d="M127 216Q128 270 118 302Q120 340 115 370L104 370Q102 332 104 302Q100 262 100 222Z"/>';
  o+='<path d="M76 98Q58 130 54 196L64 198Q70 150 86 114Z"/><path d="M124 98Q142 130 146 196L136 198Q130 150 114 114Z"/><ellipse cx="59" cy="204" rx="6" ry="9"/><ellipse cx="141" cy="204" rx="6" ry="9"/></g>';
  o+='<g fill="#000" opacity=".07"><path d="M100 222Q98 262 96 302Q98 332 96 370L104 370Q102 332 104 302Q102 262 100 222Z"/><path d="M118 168Q128 130 124 96L116 100Q120 134 112 168Z"/></g>';
  o+=OF[q.o].replace(/@/g,oc)+SH[q.s].replace(/@/g,sc);
  if(HF[q.h])o+=HF[q.h].replace(/@/g,hc);
  o+='<ellipse cx="76" cy="54" rx="3.5" ry="6" fill="'+sk+'"/><ellipse cx="124" cy="54" rx="3.5" ry="6" fill="'+sk+'"/><ellipse cx="100" cy="52" rx="24" ry="28" fill="'+sk+'"/>';
  o+='<ellipse cx="90" cy="54" rx="5.5" ry="3.6" fill="#fff"/><ellipse cx="110" cy="54" rx="5.5" ry="3.6" fill="#fff"/><circle cx="90" cy="54" r="3" fill="#4a2f22"/><circle cx="110" cy="54" r="3" fill="#4a2f22"/><circle cx="91" cy="53" r="1" fill="#fff"/><circle cx="111" cy="53" r="1" fill="#fff"/>';
  o+='<path d="M84 51Q90 47 96 51M104 51Q110 47 116 51" stroke="#2a1a14" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M83 44Q90 41 97 44M103 44Q110 41 117 44" stroke="'+hc+'" stroke-width="2" fill="none"/>';
  o+='<path d="M100 57Q103 65 99 66" stroke="#c9946f" stroke-width="1.6" fill="none"/><path d="M92 72Q100 79 108 72Q100 74 92 72Z" fill="#d9566e"/><circle cx="82" cy="65" r="5" fill="#ff8aa0" opacity=".35"/><circle cx="118" cy="65" r="5" fill="#ff8aa0" opacity=".35"/>';
  o+='<path d="M74 54C70 18 130 14 126 54C122 40 108 32 98 34C88 36 78 44 74 54Z" fill="'+hc+'"/><path d="M84 34Q100 26 116 36" stroke="#fff" stroke-opacity=".3" stroke-width="3" fill="none"/>';
  if(q.x===1)o+='<path d="M80 30L84 6L93 20L100 2L107 20L116 6L120 30Z" fill="'+xc+'"/>';
  if(q.x===2)o+='<g fill="'+xc+'"><path d="M122 30L104 20V42Z"/><path d="M122 30L140 20V42Z"/><circle cx="122" cy="30" r="4"/></g>';
  if(q.x===3)o+='<g fill="none" stroke="'+xc+'" stroke-width="3"><circle cx="90" cy="54" r="9"/><circle cx="110" cy="54" r="9"/><path d="M99 54H101"/></g>';
  if(XT[q.x])o+=XT[q.x].replace(/@/g,xc);
  $("av").innerHTML='<svg viewBox="0 0 200 400" aria-hidden="true">'+o+'</svg>'
}
function swatches(key){
  var cur=look()[key],h='<div class="sw">';
  PAL.forEach(function(p){h+='<button data-a="col" data-k="'+key+'" data-v="'+p[0]+'" class="'+(cur===p[0]?"sel":"")+'" style="background:'+p[1]+'"></button>'});
  return h+'</div>'
}
function bar(){var p=Math.min(100,Math.round(S.rp/NEED*100));return '<div style="background:#0c0d1c;border-radius:10px;height:18px;overflow:hidden;border:2px solid #a58be0;margin-top:8px"><i style="display:block;height:100%;width:'+p+'%;background:#ff7fb0"></i></div><div class="note">🎟️ Runway ticket: '+Math.min(S.rp,NEED)+' / '+NEED+' ✨</div>'}
function panel(){
  var t=S.tab,h="";
  if(t==="math"){
    if(!S.q)S.q=mathQ();
    h='<div class="mq big">'+S.q.q+'</div><div class="ch">';
    S.q.o.forEach(function(v){h+='<button data-a="ans" data-v="'+v+'">'+v+'</button>'});
    h+='</div><div class="m">'+S.msg+'</div>'+bar()+'<div class="note">Level '+S.ml+' · Collect '+NEED+' ✨ to open the runway!</div>'
  }else if(t==="show"){
    if(!S.th)S.th=THEMES[r(0,THEMES.length-1)];
    var T=S.th;
    h='<div class="theme">Today’s theme:<div class="big">'+T.e+' '+T.n+'</div>Colors to try: <b>'+T.c.join(", ")+'</b></div>';
    if(S.res){h+='<div class="stars">'+"⭐".repeat(S.res.s)+"☆".repeat(5-S.res.s)+'</div><div class="m">'+S.res.t+'</div><button class="go" data-a="next">New theme ›</button>'}
    else if(S.rp<NEED)h+='<div class="note" style="margin:14px 0">🔒 The runway is locked. Answer math questions to collect '+NEED+' ✨ for your ticket!</div>'+bar()+'<button class="go" data-a="tomath">🧮 Go to Math</button>';
    else h+='<div class="note" style="margin:14px 0">🎟️ Ticket ready! Dress up in the theme, then walk the runway!</div><button class="go" data-a="walk">🎀 Walk the runway!</button>'
  }else{
    var c=CAT[t],q=look();
    h='<div class="items">';
    c.it.forEach(function(it,i){h+='<button class="it'+(q[t]===i?" sel":"")+'" data-a="item" data-i="'+i+'">'+it[0]+'<small>'+(S.owned[t+i]?"✓ yours":"✨ "+it[1])+'</small></button>'});
    h+='</div>';
    var pv=S.pv[t];
    if(pv!==undefined&&!S.owned[t+pv]){var cost=c.it[pv][1];h+='<button class="buy" data-a="buy" '+(S.coins<cost?"disabled":"")+'>'+(S.coins<cost?"Need "+(cost-S.coins)+" more ✨ (play Math!)":"Buy for ✨ "+cost)+'</button>'}
    h+='<div class="lab">Color</div>'+swatches(c.col);
    if(t==="h"){h+='<div class="lab">Skin</div><div class="sw">';SK.forEach(function(s,i){h+='<button data-a="skin" data-v="'+i+'" class="'+(S.skin===i?"sel":"")+'" style="background:'+s+'"></button>'});h+='</div>'}
  }
  $("panel").innerHTML=h
}
function render(){
  $("coins").textContent="✨ "+S.coins;
  var tb="";[["math","🧮 Math"],["h","💇 Hair"],["o","👗 Outfit"],["s","👠 Shoes"],["x","💍 Extras"],["show",S.rp>=NEED?"🎀 Show":"🔒 Show"]].forEach(function(x){tb+='<button data-t="'+x[0]+'" class="'+(S.tab===x[0]?"on":"")+'">'+x[1]+'</button>'});
  $("tabs").innerHTML=tb;av();panel()
}
function setTab(t){S.tab=t;S.pv={};S.res=null;render()}
function answer(v){
  if(S.lock)return;S.lock=true;
  if(+v===S.q.a){
    var g=10+(S.st>=2?5:0),was=S.rp;S.coins+=g;S.rp+=g;S.st++;S.mc++;sfx("ok");S.msg="+"+g+" ✨ "+(S.st>=3?"Streak "+S.st+"! 🔥":"Great!");
    if(was<NEED&&S.rp>=NEED)S.msg+=" 🎟️ Runway open!";
    if(S.mc%5===0){S.ml++;S.msg+=" Level up! ⚡"}
    save()
  }else{S.st=0;sfx("bad");S.msg="Answer: "+S.q.a+". Try the next one!"}
  render();
  setTimeout(function(){S.q=mathQ();S.lock=false;if(S.tab==="math"){S.msg="";panel()}},S.msg.indexOf("Answer")===0?1700:800)
}
function walk(){if(S.rp<NEED)return;S.rp-=NEED;save();
  S.pv={};var q=S.eq,T=S.th,m=0,n=[];
  if(T.c.indexOf(q.oc)>-1)m++;else n.push("try "+T.c[0]+" for your outfit");
  if(T.o.indexOf(q.o)>-1)m++;else n.push("pick "+CAT.o.it[T.o[0]][0]);
  if(T.x.indexOf(q.x)>-1)m++;else n.push("add "+CAT.x.it[T.x[0]][0]);
  if(T.c.indexOf(q.sc)>-1||T.s.indexOf(q.s)>-1)m++;else n.push("change your shoes");
  if(T.c.indexOf(q.hc)>-1)m++;else n.push("a "+T.c[0]+" hair color");
  var s=Math.min(5,1+m),g=s*15;
  $("rwt").textContent=T.e+" "+T.n;$("stage").classList.add("walk");sfx("win");
  setTimeout(function(){
    $("stage").classList.remove("walk");S.coins+=g;save();
    S.res={s:s,t:(s>=5?"WOW! Perfect look! ":s>=3?"Great style! ":"Nice try! ")+"+"+g+" ✨"+(n.length&&s<5?" · Tip: "+n[0]:"")};
    render()
  },3100)
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="snd"){S.snd=!S.snd;b.textContent=S.snd?"🔊":"🔇";return}
  if(b.dataset.t){setTab(b.dataset.t);return}
  var a=b.dataset.a,t=S.tab;if(!a)return;
  if(a==="ans")answer(b.dataset.v);
  else if(a==="item"){var i=+b.dataset.i;if(S.owned[t+i]){S.eq[t]=i;delete S.pv[t];save()}else S.pv[t]=i;render()}
  else if(a==="buy"){var i2=S.pv[t],cost=CAT[t].it[i2][1];if(S.coins>=cost){S.coins-=cost;S.owned[t+i2]=1;S.eq[t]=i2;delete S.pv[t];sfx("buy");save()}render()}
  else if(a==="col"){S.eq[b.dataset.k]=b.dataset.v;save();render()}
  else if(a==="skin"){S.skin=+b.dataset.v;save();render()}
  else if(a==="walk")walk();
  else if(a==="tomath")setTab("math");
  else if(a==="next"){S.th=null;S.res=null;render()}
});
render()
})();
</script>
</body>
</html>
